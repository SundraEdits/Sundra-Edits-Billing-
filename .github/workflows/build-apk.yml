
name: Build Sundra Edits APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 4. Find and extract ZIP
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          ZIP_FILES=( *.zip )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Root folder must contain exactly one ZIP."
            echo "Found: ${#ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/sundra-project"

          python3 - "$ZIP_FILE" "$RUNNER_TEMP/sundra-project" <<'PY'
          import sys
          import zipfile

          zip_file = sys.argv[1]
          output_dir = sys.argv[2]

          try:
              with zipfile.ZipFile(zip_file, "r") as archive:
                  bad_file = archive.testzip()

                  if bad_file:
                      raise SystemExit(
                          f"ZIP integrity error: {bad_file}"
                      )

                  archive.extractall(output_dir)

          except zipfile.BadZipFile as error:
              raise SystemExit(f"Invalid ZIP: {error}")

          print("ZIP integrity check passed.")
          print("ZIP extraction completed.")
          PY

          # Locate Android project
          mapfile -t PROJECT_FILES < <(
            find "$RUNNER_TEMP/sundra-project" \
              -type f \
              -name settings.gradle.kts \
              -not -path '*/.github/*'
          )

          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected one Android project."
            echo "Found: ${#PROJECT_FILES[@]}"
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"

          # Check required files
          for FILE in \
            build.gradle.kts \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          do
            if [ ! -f "$PROJECT_DIR/$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project located successfully."

      # 5. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      # 6. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 7. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUNDRA-EDITS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
