
name: Build Sundra Edits APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          ZIP_FILES=( *.zip )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Exactly one ZIP file must be in repository root."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/sundra-project"

          python3 - "$ZIP_FILE" "$RUNNER_TEMP/sundra-project" <<'PY'
          import sys
          import os
          import zipfile

          zip_file = sys.argv[1]
          output_dir = os.path.realpath(sys.argv[2])

          try:
              with zipfile.ZipFile(zip_file, "r") as archive:
                  bad_file = archive.testzip()

                  if bad_file:
                      raise SystemExit(
                          f"ZIP integrity error: {bad_file}"
                      )

                  extracted = 0
                  skipped = 0

                  for item in archive.infolist():
                      name = item.filename

                      if not name or not name.strip():
                          skipped += 1
                          print("Skipping empty filename entry")
                          continue

                      name = name.replace("\\", "/")

                      if name.startswith("/"):
                          raise SystemExit(f"Unsafe ZIP path: {name}")

                      destination = os.path.realpath(
                          os.path.join(output_dir, name)
                      )

                      if os.path.commonpath(
                          [output_dir, destination]
                      ) != output_dir:
                          raise SystemExit(f"Unsafe ZIP path: {name}")

                      if item.is_dir():
                          os.makedirs(destination, exist_ok=True)
                          continue

                      os.makedirs(
                          os.path.dirname(destination),
                          exist_ok=True
                      )

                      with archive.open(item) as source:
                          with open(destination, "wb") as target:
                              while True:
                                  chunk = source.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  target.write(chunk)

                      extracted += 1

          except zipfile.BadZipFile as error:
              raise SystemExit(f"Invalid ZIP file: {error}")

          print(f"Extraction complete: {extracted} files")
          print(f"Skipped empty entries: {skipped}")
          PY

          mapfile -t PROJECT_FILES < <(
            find "$RUNNER_TEMP/sundra-project" \
              -type f \
              -name settings.gradle.kts \
              -not -path '*/.github/*'
          )

          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Android project."
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"

          for FILE in \
            build.gradle.kts \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          do
            if [ ! -f "$PROJECT_DIR/$FILE" ]; then
              echo "ERROR: Missing required file: $FILE"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUNDRA-EDITS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
